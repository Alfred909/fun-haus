function makeRoom(i){const r={w:1920,h:1120,walls:[],furniture:[],ghosts:[],seen:new Set(),labels:[]};

function route(a,b){const cols=48,rows=28,start=Math.floor(a.y/T)*cols+Math.floor(a.x/T),end=Math.floor(b.y/T)*cols+Math.floor(b.x/T),prev=new Map([[start,-1]]),q=[start];let head=0;

function select(i){if(s.mode!=='room'||s.paused)return;s.crew[s.selected].path=[];s.selected=i;log('crew_selected',i+1);say('Ghostbuster '+(i+1)+' selected. Tap open floor to move; the other holds position.');ui()}

function toggle(){if(s.mode!=='room'||s.paused)return;if(!s.battery){say('Battery empty. Return to headquarters.');return}s.beams=!s.beams;ui()}
function trap(){if(s.mode!=='room'||s.paused)return;if(!s.trap){if(s.used>=s.capacity){say('No empty traps. Return to headquarters.');return}s.trap={x:s.crew[s.selected].x,y:s.crew[s.selected].y};say('Trap placed. Guide a weakened ghost inside the gold ring and open it.')}else{const r=room(),caught=r.ghosts.filter(g=>g.hp<=25&&dist(g,s.trap)<110&&sight(g,s.trap));if(!caught.length){say('Get a ghost below 25% energy and inside the trap ring.');return}r.ghosts=r.ghosts.filter(g=>!caught.includes(g));s.used++;s.caught+=caught.length;s.trap=null;log('capture',caught.length);say('Ghost captured. Keep searching or return to the van.');if(!r.ghosts.length){const j=s.jobs[s.job],pay=Math.max(200,600+j.count*150-Math.round(j.damage));s.cash+=pay;s.done++;j.active=false;j.cool=100;j.room=null;s.mode='city';s.beams=false;s.overview=false;s.pk=Math.max(0,s.pk-16);log('job_paid',pay);say('Building cleared! Earned $'+pay+'. Your van is waiting outside.');if(s.done>=3&&s.cash>=1000)finish(true)}}ui()}

function move(c,dx,dy){if(!blocked(c.x+dx,c.y))c.x+=dx;if(!blocked(c.x,c.y+dy))c.y+=dy}
function walk(c,dt,speed,collision){let budget=dt*speed;while(c.path.length&&budget>0){const p=c.path[0],d=dist(c,p);let step=Math.min(d,budget);if(d>.01){const dx=(p.x-c.x)/d*step,dy=(p.y-c.y)/d*step;if(collision)move(c,dx,dy);else{c.x+=dx;c.y+=dy}}budget-=step;if(dist(c,p)<2)c.path.shift();else break}}
function road(x,y){return x>60&&x<2180&&y>80&&y<1360&&(roadX.some(v=>Math.abs(x-v)<45)||roadY.some(v=>Math.abs(y-v)<45))}
function update(dt){if(s.paused||s.mode==='end')return;s.time+=dt;if(s.mode!=='hq'){s.pk+=dt*.035;s.jobs.slice(1).forEach(j=>{if(j.active)s.pk+=dt*.008;else{j.cool-=dt;if(j.cool<=0){j.active=true;j.damage=0;j.room=null}}});if(s.pk>=100){s.pk=100;finish(false);return}}
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
if(s.mode==='city'){if(dx||dy){s.overview=false;s.van.path=[];const k=240*s.speed*dt/Math.hypot(dx,dy);if(road(s.van.x+dx*k,s.van.y))s.van.x+=dx*k;if(road(s.van.x,s.van.y+dy*k))s.van.y+=dy*k}else walk(s.van,dt,280*s.speed,false)}
if(s.mode==='room'){const r=room();if(dx||dy){s.overview=false;const c=s.crew[s.selected];c.path=[];const k=220*dt/Math.hypot(dx,dy);move(c,dx*k,dy*k)}s.crew.forEach(c=>walk(c,dt,220,true));if(s.beams){s.battery=Math.max(0,s.battery-dt*.65);if(!s.battery)s.beams=false}
for(const g of r.ghosts){const hit=s.beams?s.crew.filter(c=>dist(c,g)<320&&sight(c,g)).length:0;g.hp=Math.max(0,g.hp-hit*dt*18*s.power);if(hit&&s.trap&&sight(g,s.trap)){let d=dist(g,s.trap);if(d>2){g.x+=(s.trap.x-g.x)/d*dt*65;g.y+=(s.trap.y-g.y)/d*dt*65}}else if(!hit){let nx=clamp(g.x+Math.sin(s.time+g.phase)*dt*40,g.zone.x,g.zone.x+g.zone.w),ny=clamp(g.y+Math.cos(s.time*.9+g.phase)*dt*35,g.zone.y,g.zone.y+g.zone.h);if(!blocked(nx,g.y,20))g.x=nx;if(!blocked(g.x,ny,20))g.y=ny}if(g.found&&!hit)s.jobs[s.job].damage+=dt*.3}reveal()}

for(let x=0;x<48;x++)for(let y=0;y<28;y++)if(!r.seen.has(y*48+x))rect(x*T,y*T,T+1,T+1,'#102329');
for(const g of r.ghosts)if(s.crew.some(c=>dist(c,g)<380&&sight(c,g)))ghost(g);
s.crew.forEach((c,i)=>{const col=i?'#83d5f2':'#ffcf86';if(s.beams)r.ghosts.filter(g=>dist(c,g)<320&&sight(c,g)).forEach(g=>{ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo((c.x+g.x)/2+Math.sin(s.time*30)*7,(c.y+g.y)/2);ctx.lineTo(g.x,g.y);ctx.stroke()});if(i===s.selected){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,26,0,7);ctx.stroke();if(c.path.length){let p=c.path[c.path.length-1];text('×',p.x,p.y,30,col)}}circle(c.x,c.y,18,'#d6c6a6');rect(c.x-19,c.y-10,10,24,'#203440');text(i+1,c.x,c.y+6,18,'#142b32');text(i===s.selected?'SELECTED':'HOLD',c.x,c.y-35,12,col)})}
function draw(){camera();rect(0,0,cv.width,cv.height,'#102329');ctx.save();ctx.scale(view.scale,view.scale);ctx.translate(-view.x,-view.y);if(s.mode==='room')roomDraw();else cityDraw();ctx.restore();
rect(0,0,cv.width,37,'#14282eee');text(s.mode==='room'?places[s.job].name:s.overview?'DISTRICT MAP · TAP A DESTINATION':'NIGHT SHIFT · RIVERSIDE DISTRICT',cv.width/2,25,17,'#c4ebcf');
if(s.mode==='room'){let c=s.crew[s.selected],g=room().ghosts.reduce((a,b)=>!a||dist(c,b)<dist(c,a)?b:a,null);if(g){const d=dist(c,g),ang=Math.atan2(g.y-c.y,g.x-c.x),dirs=['E','SE','S','SW','W','NW','N','NE'],direction=dirs[(Math.round(ang/(Math.PI/4))+8)%8];rect(0,cv.height-37,cv.width,37,'#14282eee');text('SCANNER: '+(d<320?'STRONG':d<750?'MEDIUM':'FAINT')+' · '+direction+'    |    Crew '+(s.selected+1)+' selected',cv.width/2,cv.height-12,16,'#bceec9')}}
if(s.paused||s.mode==='hq'||s.mode==='end'){rect(cv.width/2-200,cv.height/2-50,400,100,'#13282ef5');text(s.paused?'PAUSED':s.mode==='hq'?'HEADQUARTERS':'SHIFT REPORT',cv.width/2,cv.height/2-5,28,'#b8f2c7');text(s.paused?'Press Resume':s.mode==='hq'?'Equipment serviced · upgrades below':s.done+' jobs · '+s.caught+' ghosts · $'+s.cash,cv.width/2,cv.height/2+28,17)}}
function canvasTap(e){if(s.paused)return;const b=cv.getBoundingClientRect(),p={x:(e.clientX-b.left)*cv.width/b.width/view.scale+view.x,y:(e.clientY-b.top)*cv.height/b.height/view.scale+view.y};if(s.mode==='room'){const radius=Math.max(32,26*cv.width/b.width/view.scale);const hit=s.crew.map((c,i)=>({i,d:dist(c,p)})).filter(v=>v.d<radius).sort((a,b)=>a.d-b.d)[0];if(hit){select(hit.i);return}if(blocked(p.x,p.y)){say('Choose open floor. Doorways connect the rooms.');return}const c=s.crew[s.selected],path=route(c,p);if(!path.length){say('No clear route to that spot. Try a doorway.');return}c.path=path;s.overview=false;log('move_order',{crew:s.selected+1,x:Math.round(p.x),y:Math.round(p.y)});ui()}else if(s.mode==='city'){const building=places.find(v=>Math.abs(p.x-v.x)<125&&p.y>v.y-170&&p.y<v.y+70);drive(building||p)}}
cv.addEventListener('pointerdown',canvasTap);
$('action').onclick=enter;$('crew0').onclick=()=>select(0);$('crew1').onclick=()=>select(1);$('beam').onclick=toggle;$('trap').onclick=trap;$('overview').onclick=()=>{s.overview=!s.overview;ui()};$('pause').onclick=()=>{s.paused=!s.paused;keys={};ui()};$('regroup').onclick=()=>{if(s.mode!=='room'||s.paused)return;const a=s.crew[s.selected],b=s.crew[1-s.selected];a.path=[];const p=[{x:a.x+70,y:a.y},{x:a.x-70,y:a.y},{x:a.x,y:a.y+70}].find(p=>!blocked(p.x,p.y));if(p)b.path=route(b,p);say('Other crew member called to your position.');log('regroup',s.selected+1)};
$('exit').onclick=()=>{if(s.paused)return;s.mode='city';s.overview=false;s.beams=false;s.trap=null;say('Back at the van. Unfinished hauntings retain their progress.');ui()};
for(const[id,cost,key,max]of[['capacity',350,'capacity',8],['power',450,'power',3],['van',300,'speed',2]])$(id).onclick=()=>{if(s.mode!=='hq'||s.paused||s.cash<cost||s[key]>=max)return;s.cash-=cost;s[key]++;log('upgrade',key);say('Upgrade installed.');ui()};
$('restart').onclick=()=>{if(confirm('Start a new shift? Current progress will be reset.'))reset()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:'Night Shift v2',stats:{cash:s.cash,jobs:s.done,ghosts:s.caught,seconds:s.time},events:s.log},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='night-shift-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('keydown',e=>{if(!started){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();startShift()}return}if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.key]=true;keys[k]=true;if(e.repeat)return;if(e.code==='Digit1')select(0);if(e.code==='Digit2')select(1);if(e.code==='Space')toggle();if(e.code==='KeyT')trap();if(e.code==='Enter'&&e.target.tagName!=='BUTTON')enter()});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});window.addEventListener('blur',()=>{keys={};s.paused=true;ui()});
function startShift(){if(started)return;started=true;$('opening').hidden=true;reset();document.activeElement?.blur()}
$('start-shift').onclick=startShift;
reset();s.paused=true;NightShiftTitle.draw($('title-screen').getContext('2d'),960,640);
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
